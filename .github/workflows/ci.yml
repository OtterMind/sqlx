name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python tests/distribution.py
      - run: python tests/installers.py
      - run: python tests/ui_lifecycle.py
      - run: python tests/ui_distribution.py
      - run: python tests/ui_plugins.py
      - run: python tests/updates.py
      - run: npm --prefix packages/npm-installer test
  databases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      # These tests use the MySQL and PostgreSQL fixtures only; the other engines have their own jobs.
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 180 mysql postgres
      - run: python3 tests/integration.py
      - run: python3 tests/ui_api.py
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  additional-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/jdbc/pom.xml
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      - run: mvn -B -f java/jdbc/pom.xml verify
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 300 mariadb cockroachdb clickhouse trino
      - run: bash scripts/jdbc-fixture.sh clickhouse
      - run: bash scripts/jdbc-fixture.sh trino
      - run: python3 tests/databases.py mariadb cockroachdb clickhouse trino
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  wire-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      # TiDB and YugabyteDB reuse the MySQL and PostgreSQL workers, so no JDBC runtime is needed.
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 600 tidb yugabytedb
      - run: python3 tests/databases.py tidb yugabytedb
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  olap-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      # Each of these runs a frontend and a backend in one container, so they take turns.
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 900 starrocks
      - run: python3 tests/databases.py starrocks
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 900 doris
      - run: python3 tests/databases.py doris
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  domestic-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/jdbc/pom.xml
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      - run: mvn -B -f java/jdbc/pom.xml verify
      # GreatSQL reuses the MySQL worker; TDengine needs its JDBC driver staged.
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 300 greatsql tdengine
      - run: bash scripts/jdbc-fixture.sh tdengine
      - run: python3 tests/databases.py greatsql tdengine
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  domestic-server-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --workspace --locked
      # OceanBase runs a whole cluster in one container, so the two take turns.
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 600 opengauss
      - run: python3 tests/databases.py opengauss
      - if: failure()
        run: |
          docker logs sqlx-integration-opengauss-1 --tail 40 || true
          docker inspect sqlx-integration-opengauss-1 --format '{{json .State.Health}}' || true
          docker exec sqlx-integration-opengauss-1 bash -lc 'ls /usr/local/opengauss/bin | head' || true
          docker exec sqlx-integration-opengauss-1 bash -lc "PGPASSWORD=SQLX@TestOnly12345 /usr/local/opengauss/bin/gsql -h 127.0.0.1 -p 5432 -U gaussdb -d postgres -c 'SELECT 1'" || true
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
      - run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 900 oceanbase
      - run: python3 tests/databases.py oceanbase
      - if: failure()
        run: docker logs sqlx-integration-oceanbase-1 --tail 60 || true
      - if: always()
        run: docker compose -f tests/compose.yaml down -v
  jdbc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/jdbc/pom.xml
      - run: mvn -B -f java/jdbc/pom.xml verify
  jdbc-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [oracle, sqlserver]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/jdbc/pom.xml
      - run: cargo build -p ottermind-sqlx --locked
      - run: mvn -B -f java/jdbc/pom.xml package
      - run: bash scripts/jdbc-fixture.sh '${{ matrix.database }}'
      - run: python3 tests/jdbc_integration.py '${{ matrix.database }}'
      - if: failure()
        run: docker logs 'sqlx-jdbc-${{ matrix.database }}' --tail 100
      - if: always()
        run: docker rm -f 'sqlx-jdbc-${{ matrix.database }}' || true
