name: Packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified assets as a GitHub Release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sqlx-packages
  cancel-in-progress: false
jobs:
  native:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: windows-latest, platform: windows-x64}
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Configure organization signing credentials
        if: runner.os == 'macOS'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.MAC_APPLE_ID || secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MAC_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: bash scripts/configure-macos-signing.sh
      - if: runner.os == 'macOS'
        run: bash scripts/sign-macos.sh
      - run: python scripts/package.py --platform '${{ matrix.platform }}'
      - if: runner.os == 'macOS'
        run: bash scripts/notarize-macos.sh
      - name: Remove temporary keychain
        if: always() && runner.os == 'macOS'
        run: bash scripts/cleanup-macos-signing.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/jdbc/pom.xml
      - run: mvn -B -f java/jdbc/pom.xml verify
      - run: python3 scripts/package-shared.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-shared
          path: dist/
          if-no-files-found: error
  assemble:
    needs: [native, shared]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/manifest.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: dist/
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          test "$passed" -gt 0
          # checkout's shallow SHA fetch creates a local lightweight tag; retrieve the actual tag object.
          git fetch --force origin refs/tags/v0.1.1:refs/tags/v0.1.1
          test "$(git rev-parse 'v0.1.1^{commit}')" = "$GITHUB_SHA"
          test "$(git describe --tags --exact-match HEAD)" = v0.1.1
          test "$(git cat-file -t refs/tags/v0.1.1)" = tag
          gh release create v0.1.1 --draft --verify-tag --title 'SQLX 0.1.1' --notes-file docs/release-notes.md dist/*.zip dist/manifest.json dist/SHA256SUMS dist/release-version.txt
          gh release edit v0.1.1 --draft=false --latest
