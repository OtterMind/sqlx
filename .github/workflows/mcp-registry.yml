name: MCP Registry

# Publishes the OCI image the MCP Registry entry points at, then publishes the entry itself.
#
# It runs on the release rather than on the tag, because the image downloads the Linux binary from
# that release and the release only exists once Packages has assembled it. The entry's name must
# match the io.modelcontextprotocol.server.name label in sqlx-mcp.Dockerfile: that is how the
# registry verifies the publisher owns the package.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published release to re-publish, without the leading v (for example 0.1.21)
        required: true
permissions:
  contents: read
concurrency:
  group: mcp-registry
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # authenticate to the MCP Registry with GitHub OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The entry and the image definition are maintained on the default branch. They are not
          # read from the tag: a release cut before they existed has neither, which is exactly the
          # case this workflow was added for.
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.release.tag_name || inputs.version }}"
          version="${version#v}"
          case "${version}" in
            ''|*[!0-9.]*) echo "invalid release version: ${version}" >&2; exit 1 ;;
          esac
          # The image downloads this release's Linux binary, so the release has to exist first.
          gh release view "v${version}" --json tagName --jq .tagName > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Point server.json at this release
        run: |
          version="${{ steps.release.outputs.version }}"
          jq --arg version "${version}" \
            '.version = $version | .packages[0].identifier = "ghcr.io/ottermind/sqlx:" + $version' \
            server.json > server.tmp
          mv server.tmp server.json
      - name: Publish the image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Only amd64 is built: a registry client that needs another architecture can run this one
          # under the emulation it already has, and building both would need QEMU here.
          docker build \
            --build-arg "SQLX_VERSION=${VERSION}" \
            --tag "ghcr.io/ottermind/sqlx:${VERSION}" \
            --tag ghcr.io/ottermind/sqlx:latest \
            --file sqlx-mcp.Dockerfile \
            .
          docker push --all-tags ghcr.io/ottermind/sqlx
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
