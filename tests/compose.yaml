name: sqlx-integration
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlx_test_only_password
      MYSQL_DATABASE: sqlx_test
    ports: ["127.0.0.1:23306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psqlx_test_only_password"]
      interval: 3s
      timeout: 3s
      retries: 40
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: sqlx_test_only_password
      POSTGRES_DB: sqlx_test
    ports: ["127.0.0.1:25432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlx_test"]
      interval: 3s
      timeout: 3s
      retries: 30
