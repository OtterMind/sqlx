name: sqlx-integration
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlx_test_only_password
      MYSQL_DATABASE: sqlx_test
    ports: ["127.0.0.1:23306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psqlx_test_only_password"]
      interval: 3s
      timeout: 3s
      retries: 40
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: sqlx_test_only_password
      POSTGRES_DB: sqlx_test
    ports: ["127.0.0.1:25432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlx_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: sqlx_test_only_password
      MARIADB_DATABASE: sqlx_test
    ports: ["127.0.0.1:23307:3306"]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-psqlx_test_only_password"]
      interval: 3s
      timeout: 3s
      retries: 40
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.0
    command: start-single-node --insecure
    ports: ["127.0.0.1:26257:26257"]
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=127.0.0.1:26257", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 40
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: sqlx
      CLICKHOUSE_PASSWORD: sqlx_test_only_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:28123:8123"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40
  trino:
    image: trinodb/trino:476
    ports: ["127.0.0.1:28082:8080"]
    healthcheck:
      # /v1/info answers before the coordinator accepts queries, so wait for starting:false.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 40
  tidb:
    image: pingcap/tidb:v8.5.8
    ports: ["127.0.0.1:24000:4000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10080/status"]
      interval: 5s
      timeout: 5s
      retries: 60
  yugabytedb:
    image: yugabytedb/yugabyte:2026.1.1.2-b9
    command: bin/yugabyted start --daemon=false
    ports: ["127.0.0.1:25433:5433"]
    healthcheck:
      # The processes bind to the container address, so ask YSQL there rather than on loopback.
      test: ["CMD-SHELL", "ysqlsh -h $(hostname -i) -p 5433 -U yugabyte -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 120
  # StarRocks and Doris both run a frontend and a backend in one container and need several
  # gigabytes, so CI starts them one at a time instead of together with the other fixtures.
  starrocks:
    image: starrocks/allin1-ubuntu:4.1.4
    ports: ["127.0.0.1:29030:9030"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 120
  doris:
    image: apache/doris:all-in-one-4.1.3
    ports: ["127.0.0.1:29031:9030"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 120

  greatsql:
    image: greatsql/greatsql:8.4.4-5
    environment:
      MYSQL_ROOT_PASSWORD: sqlx_test_only_password
      MYSQL_DATABASE: sqlx_test
    ports: ["127.0.0.1:23308:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -psqlx_test_only_password -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
  opengauss:
    image: opengauss/opengauss:5.0.0
    # The image sets up its data directory with privileged operations.
    privileged: true
    environment:
      # openGauss rejects a password without upper case, lower case, a digit and a symbol.
      GS_PASSWORD: SQLX@TestOnly12345
    ports: ["127.0.0.1:24320:5432"]
    healthcheck:
      # gsql is not on PATH in this image, and openGauss needs the password in the environment.
      test: ["CMD-SHELL", "PGPASSWORD=SQLX@TestOnly12345 /usr/local/opengauss/bin/gsql -h 127.0.0.1 -p 5432 -U gaussdb -d postgres -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60
  oceanbase:
    image: oceanbase/oceanbase-ce:4.4.2-lts
    environment:
      OB_TENANT_PASSWORD: SQLX@TestOnly12345
      OB_MEMORY_LIMIT: 4G
      OB_SYS_PASSWORD: SQLX@TestOnly12345
    ports: ["127.0.0.1:28811:2881"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot@sys -pSQLX@TestOnly12345 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 120
  tdengine:
    image: tdengine/tdengine:3.3.6.13
    ports: ["127.0.0.1:26041:6041", "127.0.0.1:26042:6030"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6041/-/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
